name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly run on the newest stable toolchain against the committed
    # Cargo.lock, to catch toolchain drift and new RustSec advisories.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # No `-D warnings`: Cargo.toml's [lints] table is the policy. Its
      # `deny` lints (panic, todo, fallible_impl_from) and `forbid`
      # (unsafe_code) fail the job; `warn` lints (all, pedantic, nursery,
      # cargo) are reported only.
      - run: cargo clippy --locked --all-targets

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # HEX parsing and device-selection tests are pure; the connect_port
      # tests use pseudo-terminal pairs and are #[cfg(unix)], and the ones
      # that open a pty are ignored on macOS (ptys reject IOSSIOSPEED). No
      # FleaScope hardware is needed.
      - run: cargo test --locked

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Binary crate: rustdoc covers private items, so any rustdoc warning
      # (broken intra-doc link, unclosed HTML tag in a doc comment) fails.
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Checks Cargo.lock against the RustSec advisory database (fetched
      # fresh on every run, so the weekly schedule also catches advisories
      # published after a change landed). Vulnerabilities fail the job;
      # unmaintained/yanked notices are reported as warnings only.
      - run: cargo audit
