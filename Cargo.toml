[package]
name = "flea-flash"
version = "0.1.0"
edition = "2021"
description = "Firmware flash tool for FleaScope devices"
license = "MIT OR Apache-2.0"

[[bin]]
name = "flea-flash"
path = "src/main.rs"

[dependencies]
# 1.0.0 is the first release with flash_upgrade/FlashProgress/FlashUpgradeError.
# To build against a local checkout, pass
# --config 'patch.crates-io.fleascope-rs.path="../fleascope-rs"'
# (and don't commit the Cargo.lock that produces: CI builds with --locked).
fleascope-rs = "1.0"
serialport = "4.8.1"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"

# ====== BUILD PROFILES ======

[profile.dev]
opt-level = 0
debug = true
lto = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
debug = false

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_arguments = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_const_for_fn = "allow"
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

panic = "deny"
todo = "deny"
fallible_impl_from = "deny"
unwrap_used = "deny"
expect_used = "deny"
